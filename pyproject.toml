[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carebench"
version = "2.3.0"
description = "CAREBench — layered evaluation for JSON extraction, reasoning-assisted extraction, and repair"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "CAREBench contributors" }]
dependencies = [
  "jsonschema>=4.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "datasets>=2.14",
  "huggingface_hub>=0.20",
  "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
carebench-score = "scripts.score_all:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sob_eval*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
